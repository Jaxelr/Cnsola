name: Publish MyGet

on:
  push:
    tags: [ '**' ]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
      - name: Pack
        run: dotnet pack Cnsola.Project.Template.csproj -o "$NUPKGS" --include-symbols
      - name: Publish MyGet
        env:
          MYGET_KEY: ${{ secrets.MYGET_KEY }}
        run: dotnet nuget push "$NUPKGS/*.nupkg" --skip-duplicate --source "$MYGET_FEED" --api-key "$MYGET_KEY"

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: 1
  TERM: xterm
  MYGET_FEED: https://www.myget.org/F/cnsola/api/v2/package
  NUPKGS: ./.nupkgs
